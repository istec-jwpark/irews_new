get_user:
  desc:
    params: |
      user_id(str)
    result: |
      사용자 정보 조회
  query: |
    SELECT 
      a.site_sq as "siteSq",
      b.site_nm as "siteNm",
      b.srvs_nm as "srvsNm",
      b.scco_cd as "sccoCd",
      a.user_sq as "userSq",
      a.user_nm as "userNm",
      a.roll_cd as "rollCd",
      a.user_id as "userId"
    FROM TB_M1_INFO_USER_BASE a
    JOIN TB_M1_INFO_SITE_BASE b ON a.site_sq = b.site_sq
    WHERE a.user_id = :user_id

update_last_login:
  desc:
    params: |
      user_id(str)
    result: |
      사용자 아이디의 접속 시간 업데이트
  query: |
    UPDATE users 
    SET last_login = SYSDATE 
    WHERE id = :user_id