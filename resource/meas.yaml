meas_cur_rsvr:
  desc:
    params: |
      siteSq(str)
    result: |
      저수지 실시간 측정 데이터
  query: |
    SELECT
      point_sq as "pointSq",
      point_gb as "pointGb",
      group_sq as "groupSq",
      equip_sq as "equipSq",
      equip_nm as "equipNm",
      obs_date as "obsDate",
      obs_lvl as "obsWlvl",
      obs_rat as "obsRat",
      bef_crvlm as "befCrvlm",
      bef_efvlm as "befEfvlm",
      obs_solar as "obsSola",
      obs_batt as "obsBatt",
      obs_temp as "obsTemp",
      obs_vlm as "obsVlm",
      eff_vlm as "effVlm",
      rcv_date as "updDate",
      obs_rat_stat as "obsStat",
      obs_valid as "obsValid"
    FROM VI_SV_MEAS_EQUIP_RSVR_C
    WHERE site_sq = :siteSq
    ORDER BY equip_nm

meas_cur_wway:
  desc:
    params: |
      siteSq(str)
    result: |
      수로 실시간 측정 데이터
  query: |
