      obs_secfl as "obsSecfl",
      obs_batt1 as "obsBatt",
      obs_batt2 as "obsSola",
      obs_temp as "obsTemp",
      ins_date as "insDate",
      upd_date as "updDate",
      obs_stat as "obsStat",
      obs_valid as "obsValid"
    FROM VI_SV_MEAS_EQUIP_WWAY_C
    WHERE site_sq = :siteSq
    ORDER BY equip_nm

meas_raw_rsvr:
  desc:
    params: |
      equipSq(str)
      begDate(str)
      endDate(str)
    result: |
      저수지 원시 측정 데이터
  query: |
    SELECT
      EQUIP_SQ AS "equipSq",
      OBS_DATE AS "obsDate",
      EFF_VLM AS "effVlm",
      OBS_VLM AS "obsVlm",
      OBS_RAT AS "obsRat",
      OBS_LVL AS "obsWlvl",
      OBS_TEMP AS "obsTemp",
      OBS_RAIN AS "obsRain",
      obs_solar as "obsSola",
      OBS_BATT AS "obsBatt",
      RCV_DATE AS "rcvDate"
    FROM VI_SV_MEAS_EQUIP_RSVR_A
    WHERE EQUIP_SQ = :equipSq
      AND OBS_DATE >= to_date(:begDate, 'yyyymmdd')
      AND OBS_DATE < (to_date(:endDate, 'yyyymmdd') + 1)
    ORDER BY OBS_DATE DESC

meas_hour_rsvr:
  desc:
    params: |
      equipSq(str)
      begDate(str)
      endDate(str)
    result: |
      저수지 시간별 측정 데이터
  query: |
    SELECT
      EQUIP_SQ as "equipSq",
      OBS_DATE as "obsDate",
      EFF_VLM as "effVlm",
      OBS_VLM as "obsVlm",
      OBS_VLM_MAX as "obsVlmMax",
      OBS_VLM_MIN as "obsVlmMin",
      round(OBS_VLM/EFF_VLM*100, 2) as "obsRat",
      round(OBS_VLM_MAX/EFF_VLM*100, 2) as "obsRatMax",
      round(OBS_VLM_MIN/EFF_VLM*100, 2) as "obsRatMin",
      OBS_LVL as "obsWlvl",
      OBS_LVL_MAX as "obsWlvlMax",
      OBS_LVL_Min as "obsWlvlMin",
      OBS_TEMP as "obsTemp",
      OBS_RAIN as "obsRain",
      obs_SOLAR as "obsSola",
      OBS_BATT as "obsBatt",
      OBS_BATT_MAX as "obsBattMax",
      OBS_BATT_MIN as "obsBattMin"
    FROM VI_SV_MEAS_EQUIP_RSVR_H
    WHERE EQUIP_SQ = :equipSq
      AND OBS_DATE >= to_date(:begDate, 'yyyymmdd')
      AND OBS_DATE < (to_date(:endDate, 'yyyymmdd') + 1)
    ORDER BY OBS_DATE DESC

